; PlatformIO Project Configuration File
;
; RFID 보안 인증 기반 자동 주차 관제 시스템
; Arduino/HAL 라이브러리를 쓰지 않고 avr-libc + 레지스터 직접 제어로 작성된
; 베어메탈 프로젝트이므로 framework 항목을 지정하지 않습니다.
; (framework = arduino 로 지정하면 Arduino 코어의 자체 main()과
;  이 프로젝트의 int main(void) 가 충돌하므로 사용하지 않습니다.)
;
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno

; 시리얼 모니터 (my_uart 드라이버 UART_BAUD 기본값과 동일)
monitor_speed = 9600

; avrdude 업로드 설정 (Uno 부트로더 기준)
upload_protocol = arduino
upload_speed = 115200

build_flags =
    -std=gnu11

; ─────────────────────────────────────────
; 테스트 환경 (examples/)
; src/main.c 대신 examples/의 테스트 코드를 빌드합니다.
; 실행: pio run -e test_buzzer_ultrasonic  /  pio run -e test_rfid_stepper
; ─────────────────────────────────────────

[env:test_buzzer_ultrasonic]
platform = atmelavr
board = uno
monitor_speed = 9600
upload_protocol = arduino
upload_speed = 115200
build_flags = -std=gnu11
build_src_filter =
    +<*>
    -<main.c>
    -<my_spi.c>
    -<my_rfid.c>
    -<my_uart.c>
    -<my_stepper.c>
    -<my_i2c.c>
    -<lcd1602_i2c.c>
    +<../examples/test_buzzer_ultrasonic.c>

[env:test_rfid_stepper]
platform = atmelavr
board = uno
monitor_speed = 9600
upload_protocol = arduino
upload_speed = 115200
build_flags = -std=gnu11
build_src_filter =
    +<*>
    -<main.c>
    -<ultrasonic.c>
    -<buzzer.c>
    -<my_i2c.c>
    -<lcd1602_i2c.c>
    +<../examples/test_rfid_stepper.c>
